<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoAnalysis</title>
    <link rel="stylesheet" href="index-styles.css"> 
</head>
<body>
    <header>
        <h1>Choose an option</h1>
        <p>Select an option to start:</p>
    </header>

    <main>
        <div class="options">
            <div class="whisper_option">
                <a href="/whisper.html" class="button">
                    <img src="./static/whisper.png" />
                    <div class="label">Whisper</div>
                </a>
            </div>
            <div class="emotion_option">
                <a href="/emotions.html" class="button">
                    <img src="static/wav2vec.jpeg" alt="Emotion Detection" />
                    <div class="label">Emotion Recognition</div>
                </a>
            </div>
            <div class="multimodal_option">
                <a href="/multimodal.html" class="button">
                    <img src="static/multimodal.png" alt="Multimodal Analysis" />
                    <div class="label">Multimodal Analysis</div>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
